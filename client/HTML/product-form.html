<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="הוספה ועריכה של מוצר בסופר דיירקט.">
    <title>ניהול מוצר | סופר דיירקט</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <aside class="announcement" aria-label="מבצע השבוע">משלוח חינם בקנייה מעל 250 ₪ · מהיום אצלכם בבית</aside>
    <header class="site-header">
        <nav class="nav-wrap" aria-label="ניווט ראשי">
            <a class="brand" href="../index.html" aria-label="סופר דיירקט - עמוד הבית"><span class="brand-mark" aria-hidden="true">✦</span>סופר דיירקט</a>
            <img class="kosher-badge-header" src="../images/badatz-logo.png" alt="בהשגחת הבד&quot;ץ ירושלים של העדה החרדית">
            <div class="nav-links"><a href="../index.html#categories">קטגוריות</a><a href="../index.html#fresh">טרי על המדף</a><a href="about.html">למה אנחנו</a></div>
        </nav>
    </header>
    <main>
        <section class="page-header" aria-labelledby="form-title">
            <p class="eyebrow">ניהול מוצרים</p>
            <h1 id="formTitle">הוספת מוצר חדש</h1>
            <p class="page-copy">מלאו את פרטי המוצר ושמרו.</p>
        </section>
        <section aria-label="טופס מוצר">
            <div class="auth-card contact-card">
                <form class="auth-form" id="productForm" method="post" action="#">
                    <div class="form-field">
                        <label for="name">שם המוצר</label>
                        <input id="name" name="name" type="text" required>
                    </div>
                    <div class="form-row">
                        <div class="form-field">
                            <label for="categoryId">קטגוריה</label>
                            <select id="categoryId" name="categoryId" required>
                                <option value="">בחרו קטגוריה</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="price">מחיר (₪)</label>
                            <input id="price" name="price" type="number" step="0.10" min="0" required>
                        </div>
                    </div>
                    <div class="form-field">
                        <label for="description">תיאור</label>
                        <textarea id="description" name="description" required></textarea>
                    </div>
                    <div class="form-field">
                        <label for="image">תמונת מוצר</label>
                        <input id="image" name="image" type="file" accept="image/*">
                    </div>
                    <div class="form-field">
                        <label>אלרגנים</label>
                        <div class="tags-checkboxes">
                            <label><input id="containsGluten" name="containsGluten" type="checkbox"> מכיל גלוטן</label>
                            <label><input id="containsDairy" name="containsDairy" type="checkbox"> מכיל חלב</label>
                            <label><input id="containsNuts" name="containsNuts" type="checkbox"> מכיל אגוזים</label>
                            <label><input id="containsEggs" name="containsEggs" type="checkbox"> מכיל ביצים</label>
                            <label><input id="containsSoy" name="containsSoy" type="checkbox"> מכיל סויה</label>
                        </div>
                    </div>
                    <button class="auth-submit" type="submit" id="submitButton">הוספת מוצר</button>
                </form>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="footer-wrap">
            <a class="brand" href="../index.html" aria-label="סופר דיירקט - עמוד הבית"><span class="brand-mark" aria-hidden="true">✦</span>סופר דיירקט</a>
            <nav class="footer-links" aria-label="ניווט תחתון"><a href="about.html">אודות</a><a href="contact.html">צור קשר</a><a href="faq.html">שאלות נפוצות</a><a href="terms.html">תנאי שימוש ופרטיות</a></nav>
        </div>
        <p class="footer-copy">© 2026 סופר דיירקט. כל הזכויות שמורות.</p>
    </footer>
    <script src="../js/cart.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/services/productService.js"></script>
    <script src="../js/services/categoryService.js"></script>
    <script src="../js/product-form.js"></script>
</body>
</html>
