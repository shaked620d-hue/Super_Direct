<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="הפרטים שלי בסופר דיירקט.">
    <title>הפרטים שלי | סופר דיירקט</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
</head>
<body>
    <aside class="announcement" aria-label="מבצע השבוע">משלוח חינם בקנייה מעל 250 ₪ · מהיום אצלכם בבית</aside>
    <header class="site-header">
        <nav class="nav-wrap" aria-label="ניווט ראשי">
            <a class="brand" href="../index.html" aria-label="סופר דיירקט - עמוד הבית"><span class="brand-mark" aria-hidden="true">✦</span>סופר דיירקט</a>
            <div class="nav-links"><a href="../index.html#categories">קטגוריות</a><a href="../index.html#fresh">טרי על המדף</a><a href="about.html">למה אנחנו</a></div>
        </nav>
    </header>
    <main class="auth-main">
        <a class="auth-back" href="../index.html">→ חזרה לדף הבית</a>
        <div class="auth-card">
            <p class="auth-eyebrow">החשבון שלי</p>
            <h1>הפרטים שלי</h1>
            <p class="auth-subtitle">כאן אפשר לראות ולעדכן את הפרטים שלכם.</p>
            <form id="profileForm" class="auth-form" method="post" action="#">
                <div class="form-row">
                    <div class="form-field">
                        <label for="firstName">שם פרטי</label>
                        <input id="firstName" name="firstName" type="text" autocomplete="given-name">
                    </div>
                    <div class="form-field">
                        <label for="lastName">שם משפחה</label>
                        <input id="lastName" name="lastName" type="text" autocomplete="family-name">
                    </div>
                </div>
                <div class="form-field">
                    <label for="email">אימייל</label>
                    <input id="email" name="email" type="email" disabled>
                </div>
                <div class="form-field">
                    <label for="address">כתובת למשלוח</label>
                    <input id="address" name="address" type="text" autocomplete="street-address">
                </div>
                <button class="auth-submit" type="submit" id="profileSaveButton" hidden>שמירת שינויים</button>
            </form>
        </div>
    </main>
    <footer class="site-footer">
        <div class="footer-wrap">
            <a class="brand" href="../index.html" aria-label="סופר דיירקט - עמוד הבית"><span class="brand-mark" aria-hidden="true">✦</span>סופר דיירקט</a>
            <nav class="footer-links" aria-label="ניווט תחתון"><a href="about.html">אודות</a><a href="contact.html">צור קשר</a><a href="faq.html">שאלות נפוצות</a><a href="terms.html">תנאי שימוש ופרטיות</a></nav>
        </div>
        <p class="footer-copy">© 2026 סופר דיירקט. כל הזכויות שמורות.</p>
    </footer>
</body>
    <script src="../js/cart.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/profile.js"></script>
</html>
